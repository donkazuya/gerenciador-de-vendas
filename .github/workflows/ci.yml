name: CI & Release Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build (Nx Monorepo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Build Nx apps (Frontend & Backend)
        run: npm run build

  package-electron-win:
    name: Package Desktop App (Windows .exe)
    needs: lint-and-build
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Package Windows Desktop App
        run: npm run package:win

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gerenciador-de-Vendas-Windows-Installer
          path: dist/executables/*.exe
          retention-days: 30
